<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Starwright · Concept A · Flight Deck</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Concept A — Flight Deck: a refined mission console. One accent (orange) reserved for the single best action;
   blue carries information. Hierarchy by size and brightness; HUD frame lines give orientation. */
:root {
  --bg: #04070d; --panel: #0b1322; --panel-2: #0f1a2e; --line: rgba(150,190,240,.13); --line-2: rgba(150,190,240,.26);
  --fg: #eef3fb; --fg-2: #b4c2d8; --muted: #7d8ca6; --blue: #8fc1f5; --blue-2: #4f7fb8; --orange: #ff8a3d; --orange-2: #ffb47f; --ink: #1a0d03; --good: #7fe0ad;
  --disp: "Unbounded", system-ui, sans-serif; --body: "Manrope", system-ui, sans-serif; --mono: "JetBrains Mono", monospace;
}
* { box-sizing: border-box; margin: 0; }
html, body { background: var(--bg); color: var(--fg); font: 15px/1.35 var(--body); -webkit-font-smoothing: antialiased; }
.screen { width: 390px; height: 844px; position: relative; overflow: hidden; margin: 0 auto;
  background: radial-gradient(420px 260px at 85% -40px, rgba(79,127,184,.28), transparent 70%), radial-gradient(300px 200px at 0% 30%, rgba(255,138,61,.05), transparent 70%), var(--bg); }
.tnum { font-variant-numeric: tabular-nums; }
/* HUD frame: fixed corner ticks for orientation */
.hud i { position: absolute; width: 14px; height: 14px; border-color: var(--line-2); border-style: solid; }
.hud .tl { top: 52px; left: 10px; border-width: 1px 0 0 1px; } .hud .tr { top: 52px; right: 10px; border-width: 1px 1px 0 0; }
/* Status bar */
.sb { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 14px 28px 0 34px; font: 600 16px/1 var(--body); }
.sb svg { display: block; }
/* Header */
.head { display: flex; justify-content: space-between; align-items: flex-end; padding: 14px 22px 14px; }
.lbl { font: 600 11px/1 var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.bal { display: flex; align-items: baseline; gap: 8px; margin-top: 8px; }
.bal b { font: 300 44px/0.95 var(--disp); letter-spacing: -.01em; }
.bal span { font: 400 20px/1 var(--disp); color: var(--blue); }
.rate { display: flex; align-items: center; gap: 8px; margin-top: 10px; font: 600 14px/1 var(--body); color: var(--fg-2); }
.rate .up { width: 18px; height: 18px; border-radius: 6px; display: grid; place-items: center; background: rgba(127,224,173,.12); color: var(--good); }
.chip-od { font: 700 11px/1 var(--body); letter-spacing: .06em; color: var(--ink); background: var(--orange); padding: 4px 7px; border-radius: 6px; }
.gauge { width: 76px; text-align: center; }
.gauge svg { display: block; margin: 0 auto; }
.gauge .t { font: 600 12px/1 var(--mono); color: var(--orange-2); margin-top: 6px; }
.gauge .l { font: 600 9.5px/1 var(--body); letter-spacing: .14em; color: var(--muted); margin-top: 5px; }
/* Scene panel */
.scene { margin: 0 14px; border-radius: 18px; overflow: hidden; position: relative; border: 1px solid var(--line); background: var(--panel); }
.scene .view { position: relative; height: 150px; }
.scene svg.yard { position: absolute; inset: 0; width: 100%; height: 100%; }
.scene .brk { position: absolute; width: 12px; height: 12px; border: 1.5px solid rgba(143,193,245,.55); }
.scene .b1 { top: 8px; left: 8px; border-width: 1.5px 0 0 1.5px; } .scene .b2 { top: 8px; right: 8px; border-width: 1.5px 1.5px 0 0; }
.scene .tag { position: absolute; bottom: 10px; left: 10px; font: 600 10px/1 var(--body); letter-spacing: .16em; color: var(--fg-2); background: rgba(4,7,13,.55); padding: 5px 8px; border-radius: 6px; backdrop-filter: blur(6px); }
.scene .tag i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--good); margin-right: 6px; box-shadow: 0 0 8px var(--good); }
.goal { padding: 11px 14px 13px; border-top: 1px solid var(--line); background: linear-gradient(180deg, rgba(15,26,46,.9), rgba(11,19,34,.95)); }
.goal .row { display: flex; justify-content: space-between; font: 600 12.5px/1 var(--body); color: var(--fg-2); }
.goal .row b { color: var(--fg); font-weight: 700; }
.goal .bar { height: 5px; border-radius: 3px; background: rgba(150,190,240,.14); margin-top: 8px; overflow: hidden; }
.goal .bar i { display: block; height: 100%; width: 62%; border-radius: 3px; background: linear-gradient(90deg, #ff9a52, var(--orange)); box-shadow: 0 0 10px rgba(255,138,61,.6); }
/* Section head */
.sec { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px 10px; }
.sec h2 { font: 400 13px/1 var(--disp); letter-spacing: .12em; text-transform: uppercase; }
.sec span { font: 600 12px/1 var(--body); color: var(--muted); }
/* Factory rows */
.list { padding: 0 14px; display: flex; flex-direction: column; gap: 10px; }
.fac { position: relative; display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 12px 12px 12px 12px; border-radius: 18px;
  background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255,255,255,.04); }
.fac.best { border-color: rgba(255,138,61,.65); box-shadow: 0 0 0 1px rgba(255,138,61,.15), 0 10px 30px rgba(255,138,61,.12); }
.fac .flag { position: absolute; top: -9px; left: 76px; font: 800 9.5px/1 var(--body); letter-spacing: .12em; color: var(--ink); background: var(--orange); padding: 4px 7px; border-radius: 6px; }
.ring { position: relative; width: 52px; height: 52px; }
.ring > svg { position: absolute; inset: 0; }
.ring .ic { position: absolute; inset: 0; display: grid; place-items: center; color: var(--blue); }
.fac.best .ring .ic { color: var(--orange); }
.info { min-width: 0; }
.nm { display: flex; align-items: baseline; gap: 8px; }
.nm b { font: 700 16px/1.1 var(--body); }
.nm em { font: 600 13px/1 var(--mono); font-style: normal; color: var(--muted); }
.sub { display: flex; align-items: center; gap: 8px; margin-top: 7px; font: 600 12px/1 var(--body); color: var(--muted); }
.share { width: 54px; height: 4px; border-radius: 2px; background: rgba(150,190,240,.14); overflow: hidden; }
.share i { display: block; height: 100%; background: var(--blue); border-radius: 2px; }
.ms { margin-top: 9px; display: flex; align-items: center; gap: 8px; }
.ms .seg { flex: 1; display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; }
.ms .seg b { height: 3px; border-radius: 2px; background: rgba(150,190,240,.14); }
.ms .seg b.f { background: var(--blue-2); }
.ms .seg b.n { background: var(--orange); }
.ms span { font: 700 11px/1 var(--body); color: var(--blue); white-space: nowrap; }
.ms span.hot { color: var(--orange-2); }
.buy { width: 104px; height: 58px; border-radius: 14px; border: 1px solid var(--line-2); display: flex; flex-direction: column; align-items: flex-end; justify-content: center; padding: 0 12px; gap: 5px; background: rgba(79,127,184,.14); }
.buy b { font: 700 15px/1 var(--body); }
.buy small { font: 600 12px/1 var(--mono); color: var(--fg-2); }
.fac.best .buy { background: linear-gradient(180deg, #ff9b57, var(--orange)); border: 0; color: var(--ink); box-shadow: 0 6px 18px rgba(255,138,61,.35); }
.fac.best .buy small { color: rgba(26,13,3,.75); }
.fac.off .buy { background: transparent; opacity: .5; }
.fac.peek { opacity: .55; }
/* Dock: buy amount + tab bar, all in the thumb zone */
.dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 14px 30px; background: linear-gradient(180deg, rgba(4,7,13,0), rgba(4,7,13,.94) 22px, var(--bg) 70%); backdrop-filter: blur(2px); }
.amt { display: flex; align-items: center; gap: 10px; margin: 0 2px 12px; }
.amt .lbl { margin-right: 2px; }
.amt .seg { flex: 1; display: flex; padding: 3px; border-radius: 12px; border: 1px solid var(--line); background: rgba(11,19,34,.9); }
.amt .seg span { flex: 1; text-align: center; padding: 8px 0; border-radius: 9px; font: 700 13px/1 var(--body); color: var(--muted); }
.amt .seg span.on { background: rgba(143,193,245,.16); color: var(--fg); box-shadow: inset 0 0 0 1px rgba(143,193,245,.3); }
.tabs { display: flex; justify-content: space-between; padding: 8px 10px; border-radius: 22px; background: rgba(11,19,34,.95); border: 1px solid var(--line); }
.tabs span { width: 62px; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 7px 0 6px; border-radius: 14px; font: 700 10.5px/1 var(--body); color: var(--muted); position: relative; }
.tabs span.on { color: var(--fg); background: rgba(143,193,245,.12); }
.tabs span.on svg { color: var(--orange); }
.tabs span .dot { position: absolute; top: 5px; right: 16px; width: 7px; height: 7px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 8px var(--orange); }
.tabs svg { width: 22px; height: 22px; }
/* Yard scene parts (shared with the game) */
.bld .b-body { fill: #101e36; stroke: rgba(156,195,238,.14); stroke-width: .6; } .bld .win { fill: #0d1a2f; } .bld .smoke { opacity: 0; }
.bld .b-line, .bld .g-line { stroke: #4f77a8; stroke-width: 1; fill: none; } .bld .b-beacon { fill: #ff8a3d; }
.bld.lit .b-body { fill: #17304f; stroke: rgba(156,195,238,.3); } .bld.lit .win.on { fill: #ffb27d; }
.bld.gantry .g-line { stroke: rgba(156,195,238,.25); stroke-dasharray: 2 3; }
#rk-flame, .moonlight, .marsdot { opacity: 0; }
.home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.85); }
</style></head>
<body>
<div class="screen">
  <div class="hud"><i class="tl"></i><i class="tr"></i></div>
  <div class="sb"><span>9:41</span><svg width="70" height="13" viewBox="0 0 70 13"><g fill="#fff"><rect x="0" y="8" width="3" height="5" rx="1"/><rect x="5" y="5.5" width="3" height="7.5" rx="1"/><rect x="10" y="3" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="13" rx="1"/><path d="M29 3.5a9 9 0 0 1 12 0l-1.4 1.5a7 7 0 0 0-9.2 0zM31.6 6.4a5 5 0 0 1 6.8 0L37 7.9a3 3 0 0 0-4 0zM35 11.5l-1.6-1.7a2.3 2.3 0 0 1 3.2 0z"/><rect x="45" y="0.5" width="22" height="12" rx="3.5" fill="none" stroke="#fff" opacity=".45"/><rect x="47" y="2.5" width="16" height="8" rx="2"/><rect x="68" y="4.5" width="1.6" height="4" rx=".8" opacity=".45"/></g></svg></div>

  <div class="head">
    <div>
      <div class="lbl">Credits</div>
      <div class="bal tnum"><b>48.21</b><span>M</span></div>
      <div class="rate tnum"><span class="up"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M5 8V2M2 5l3-3 3 3" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></span>+312.4 K / sec <span class="chip-od">×2</span></div>
    </div>
    <div class="gauge">
      <svg width="58" height="58" viewBox="0 0 58 58"><circle cx="29" cy="29" r="24" fill="none" stroke="rgba(255,138,61,.16)" stroke-width="4"/>
        <circle cx="29" cy="29" r="24" fill="none" stroke="#ff8a3d" stroke-width="4" stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="98" transform="rotate(-90 29 29)" style="filter:drop-shadow(0 0 6px rgba(255,138,61,.7))"/>
        <text x="29" y="34" text-anchor="middle" fill="#ffb47f" font-family="Unbounded" font-size="14" font-weight="500">×2</text></svg>
      <div class="t tnum">1:12:40</div><div class="l">OVERDRIVE</div>
    </div>
  </div>

  <div class="scene"><div class="view"><div class="yard" id="yard"></div><i class="brk b1"></i><i class="brk b2"></i>
    <div class="tag"><i></i>YARD · 7 / 8 ONLINE</div></div>
    <div class="goal"><div class="row"><span>Rocket Mk I · <b>Fuel Tank</b></span><b class="tnum">62%</b></div><div class="bar"><i></i></div></div>
  </div>

  <div class="sec"><h2>Factories</h2><span class="tnum">8 types · 400 owned</span></div>
  <div class="list" id="list"></div>

  <div class="dock">
    <div class="amt"><span class="lbl">Buy</span><div class="seg"><span>×1</span><span class="on">×10</span><span>×100</span><span>Max</span></div></div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="home"></div>
</div>
<script src="../js/art.js"></script>
<script>
document.body.insertAdjacentHTML('afterbegin', SW.art.defs);
var y = document.getElementById('yard');
y.innerHTML = SW.art.scene();
var svg = y.querySelector('svg'); svg.classList.add('yard'); svg.style.position = 'absolute'; svg.style.inset = '0'; svg.style.width = '100%'; svg.style.height = '100%';
// light the owned factories, show two rocket sections
[0,1,2,3,4,5,6].forEach(function (i) { var b = document.getElementById('bld-' + i); if (b) b.classList.add('lit'); });
document.getElementById('rk-clip-rect').setAttribute('y', SW.art.rocketClipY(2));
document.getElementById('station').style.opacity = 0;

var F = [
  { n: 'Bolt Press', ic: 'bolt', c: 147, share: 3, cyc: .7, ms: [8, 'f'], msText: '3 to ×2 output', hot: true, gain: '+1.20 K/s', cost: '41.3 K' },
  { n: 'Wire Mill', ic: 'wire', c: 86, share: 6, cyc: .35, ms: [7], msText: '14 to ×2 speed', gain: '+4.90 K/s', cost: '512 K' },
  { n: 'Fuel Refinery', ic: 'fuel', c: 65, share: 21, cyc: .82, ms: [3], msText: '35 to ×2 speed', gain: '+18.6 K/s', cost: '1.14 M', best: true },
  { n: 'Hull Foundry', ic: 'hull', c: 49, share: 38, cyc: .55, ms: [9], msText: '1 to ×2 speed', hot: true, gain: '+41.0 K/s', cost: '52.8 M', off: true },
  { n: 'Engine Works', ic: 'engine', c: 12, share: 32, cyc: .2, ms: [1], msText: '13 to ×2 speed', gain: '+66.2 K/s', cost: '96.4 M', off: true, peek: true }
];
function ring(p, best) {
  var c = 2 * Math.PI * 23, col = best ? '#ff8a3d' : '#8fc1f5';
  return '<svg width="52" height="52" viewBox="0 0 52 52"><circle cx="26" cy="26" r="23" fill="rgba(143,193,245,.06)" stroke="rgba(150,190,240,.14)" stroke-width="3"/>' +
    '<circle cx="26" cy="26" r="23" fill="none" stroke="' + col + '" stroke-width="3" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + (c * (1 - p)).toFixed(1) + '" transform="rotate(-90 26 26)"/></svg>';
}
document.getElementById('list').innerHTML = F.map(function (f) {
  var segs = ''; for (var i = 0; i < 10; i++) segs += '<b class="' + (i < f.ms[0] ? 'f' : '') + (i === 9 ? ' n' : '') + '"></b>';
  return '<div class="fac' + (f.best ? ' best' : '') + (f.off ? ' off' : '') + (f.peek ? ' peek' : '') + '">' + (f.best ? '<span class="flag">BEST VALUE</span>' : '') +
    '<div class="ring">' + ring(f.cyc, f.best) + '<div class="ic">' + SW.art.icon(f.ic).replace('class="ic ', 'width="22" height="22" class="') + '</div></div>' +
    '<div class="info"><div class="nm"><b>' + f.n + '</b><em>×' + f.c + '</em></div>' +
    '<div class="sub"><span class="share"><i style="width:' + Math.max(6, f.share * 2.4) + '%"></i></span>' + f.share + '% of income</div>' +
    '<div class="ms"><div class="seg">' + segs + '</div><span class="' + (f.hot ? 'hot' : '') + '">' + f.msText + '</span></div></div>' +
    '<div class="buy tnum"><b>' + f.gain + '</b><small>' + f.cost + '</small></div></div>';
}).join('');
var T = [['factory', 'Factories', 1], ['up', 'Upgrades', 0, 1], ['rocket', 'Rocket'], ['station', 'Station'], ['more', 'More', 0, 1]];
document.getElementById('tabs').innerHTML = T.map(function (t) { return '<span class="' + (t[2] ? 'on' : '') + '">' + (t[3] ? '<i class="dot"></i>' : '') + '<svg><use href="#i-' + t[0] + '"/></svg>' + t[1] + '</span>'; }).join('');
</script>
</body></html>
