<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Starwright · Concept B2 · Diorama with rings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Concept B — Diorama: the yard is the hero. A living dusk scene fills the top half; numbers float on glass;
   the factory list lives in a soft bottom sheet. Friendly, rounded, calm — premium casual. */
:root {
  --bg: #0a1222; --sheet: #0d1628; --card: #131f37; --card-2: #17253f; --line: rgba(170,200,240,.12);
  --fg: #f1f5fc; --fg-2: #c2cfe2; --muted: #8494ae; --blue: #9cc8f5; --blue-tile: #1e3a63; --orange: #ff8a3d; --orange-2: #ffb47f; --ink: #1d0e03;
  --disp: "Outfit", system-ui, sans-serif; --body: "Manrope", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { background: #050910; color: var(--fg); font: 15px/1.35 var(--body); -webkit-font-smoothing: antialiased; }
.screen { width: 390px; height: 844px; position: relative; overflow: hidden; margin: 0 auto; background: var(--bg); }
.tnum { font-variant-numeric: tabular-nums; }
.world { position: absolute; inset: 0 0 auto 0; height: 430px; }
.world svg { display: block; width: 100%; height: 100%; }
.sb { position: absolute; top: 0; left: 0; right: 0; height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 14px 28px 0 34px; font: 600 16px/1 var(--body); z-index: 3; }
.glass { background: rgba(10,20,40,.42); border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 10px 30px rgba(0,0,0,.25); }
.bal { position: absolute; top: 58px; left: 16px; padding: 12px 16px 13px; border-radius: 22px; z-index: 2; }
.bal .l { font: 600 11px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: rgba(225,235,250,.7); }
.bal .v { display: flex; align-items: baseline; gap: 6px; margin-top: 6px; }
.bal .v b { font: 600 38px/1 var(--disp); letter-spacing: -.02em; }
.bal .v span { font: 500 20px/1 var(--disp); color: var(--blue); }
.bal .r { margin-top: 6px; font: 600 13.5px/1 var(--body); color: var(--fg-2); }
.bal .r em { font-style: normal; color: var(--orange-2); }
.od { position: absolute; top: 58px; right: 16px; padding: 10px 12px 10px 10px; border-radius: 20px; display: flex; align-items: center; gap: 10px; z-index: 2; }
.od .bolt { width: 38px; height: 38px; border-radius: 14px; background: linear-gradient(160deg, #ffad6e, #ff7a29); display: grid; place-items: center; box-shadow: 0 6px 16px rgba(255,122,41,.45); }
.od b { display: block; font: 600 16px/1 var(--disp); }
.od span { display: block; margin-top: 4px; font: 600 12px/1 var(--body); color: var(--orange-2); }
.goalchip { position: absolute; left: 16px; top: 176px; width: 168px; padding: 10px 14px 12px; border-radius: 18px; z-index: 2; }
.goalchip .row { display: flex; justify-content: space-between; font: 700 12.5px/1 var(--body); }
.goalchip .row span { color: var(--fg-2); font-weight: 600; }
.goalchip .sub { margin-top: 5px; font: 600 11px/1 var(--body); color: rgba(225,235,250,.65); }
.goalchip .bar { margin-top: 8px; height: 6px; border-radius: 4px; background: rgba(255,255,255,.16); overflow: hidden; }
.goalchip .bar i { display: block; width: 62%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #ffb27d, #ff8a3d); }
/* Sheet */
.sheet { position: absolute; left: 0; right: 0; top: 384px; bottom: 0; border-radius: 30px 30px 0 0; background: linear-gradient(180deg, #111c33 0, var(--sheet) 90px); box-shadow: 0 -18px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08); z-index: 2; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.22); margin: 9px auto 0; }
.sh-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px 12px 20px; }
.sh-head h2 { font: 600 22px/1 var(--disp); letter-spacing: -.01em; }
.pills { display: flex; gap: 4px; padding: 3px; border-radius: 14px; background: rgba(255,255,255,.06); }
.pills span { padding: 7px 10px; border-radius: 11px; font: 700 12.5px/1 var(--body); color: var(--muted); }
.pills span.on { background: #f1f5fc; color: #0d1628; }
.cards { padding: 0 14px; display: flex; flex-direction: column; gap: 10px; }
.card { display: grid; grid-template-columns: 60px 1fr auto; gap: 13px; align-items: center; padding: 12px; border-radius: 22px; background: linear-gradient(180deg, var(--card-2), var(--card)); border: 1px solid var(--line); }
.card.best { background: linear-gradient(180deg, #2a2230, #1d1a2a); border-color: rgba(255,138,61,.45); }
.rt { position: relative; width: 60px; height: 60px; }
.rt .rg { position: absolute; inset: 0; }
.rt .tile { position: absolute; left: 8px; top: 8px; width: 44px !important; height: 44px !important; border-radius: 50% !important; }
.rt .cnt { position: absolute; bottom: -4px; right: -6px; min-width: 26px; padding: 3px 6px; border-radius: 9px; background: #f1f5fc; color: #0d1628; font: 800 11px/1 var(--body); text-align: center; border: 2px solid var(--sheet); }
.mseg { flex: 1; display: grid; grid-template-columns: repeat(10, 1fr); gap: 2.5px; }
.mseg b { height: 5px; border-radius: 3px; background: rgba(255,255,255,.09); }
.mseg b.f { background: #6fa8e8; }
.card.best .mseg b.f { background: #ffb27d; }
.mseg b.n { background: rgba(255,138,61,.55); box-shadow: inset 0 0 0 1px #ff8a3d; }
.tile { position: relative; width: 50px; height: 50px; border-radius: 16px; display: grid; place-items: center; color: #d8e9ff;
  background: linear-gradient(160deg, #2e5a92, #1a3459); box-shadow: inset 0 1px 0 rgba(255,255,255,.18); }
.card.best .tile { background: linear-gradient(160deg, #ffad6e, #ff7a29); color: #2a1200; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 6px 14px rgba(255,122,41,.3); }
.tile .cnt { position: absolute; bottom: -6px; right: -6px; min-width: 26px; padding: 3px 6px; border-radius: 9px; background: #f1f5fc; color: #0d1628; font: 800 11px/1 var(--body); text-align: center; border: 2px solid var(--sheet); }
.mid { min-width: 0; }
.mid .t { display: flex; align-items: center; gap: 8px; font: 700 16px/1.15 var(--body); }
.mid .t .tag { font: 800 10px/1 var(--body); letter-spacing: .04em; color: var(--ink); background: var(--orange-2); padding: 4px 7px; border-radius: 8px; }
.mid .s { margin-top: 5px; font: 600 12.5px/1 var(--body); color: var(--muted); white-space: nowrap; }
.mid .s .bv { color: var(--orange-2); font-weight: 800; }
.pr { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
.pr .prog { flex: 1; margin: 0; }
.pr span { font: 700 11px/1 var(--body); color: var(--blue); white-space: nowrap; }
.pr span.hot { color: var(--orange-2); }
.mid .s b { color: var(--fg-2); font-weight: 700; }
.mid .s .hot { color: var(--orange-2); }
.prog { margin-top: 9px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.07); overflow: hidden; }
.prog i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #6fa8e8, #a8d2fb); }
.card.best .prog i { background: linear-gradient(90deg, #ff9a52, #ffc79d); }
.btn { width: 96px; height: 54px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1); }
.btn small { font: 700 11.5px/1 var(--body); color: var(--blue); }
.btn b { font: 700 15.5px/1 var(--disp); }
.card.best .btn { background: linear-gradient(180deg, #ffa264, #ff7f33); border: 0; color: var(--ink); box-shadow: 0 8px 20px rgba(255,127,51,.35); }
.card.best .btn small { color: rgba(29,14,3,.7); }
.card.off .btn { opacity: .45; }
.fade { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(180deg, rgba(13,22,40,0), var(--sheet) 55%); z-index: 3; pointer-events: none; }
.dockbar { position: absolute; left: 20px; right: 20px; bottom: 30px; height: 68px; border-radius: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; z-index: 4; }
.dockbar span { height: 52px; min-width: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; gap: 8px; color: rgba(225,235,250,.75); position: relative; }
.dockbar span svg { width: 24px; height: 24px; }
.dockbar span.on { padding: 0 16px; background: rgba(255,255,255,.95); color: #0d1628; font: 800 14px/1 var(--body); }
.dockbar span.on svg { color: #ff7a29; }
.dockbar .dot { position: absolute; top: 12px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); border: 2px solid rgba(20,30,50,.9); }
.fac2.ghost * { fill: none !important; stroke: rgba(170,205,245,.45) !important; stroke-width: .8 !important; stroke-dasharray: 3 2.5; filter: none !important; }
.home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.85); z-index: 5; }
</style></head>
<body>
<div class="screen">
  <div class="world" id="world"></div>
  <div class="sb"><span>9:41</span><svg width="70" height="13" viewBox="0 0 70 13"><g fill="#fff"><rect x="0" y="8" width="3" height="5" rx="1"/><rect x="5" y="5.5" width="3" height="7.5" rx="1"/><rect x="10" y="3" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="13" rx="1"/><path d="M29 3.5a9 9 0 0 1 12 0l-1.4 1.5a7 7 0 0 0-9.2 0zM31.6 6.4a5 5 0 0 1 6.8 0L37 7.9a3 3 0 0 0-4 0zM35 11.5l-1.6-1.7a2.3 2.3 0 0 1 3.2 0z"/><rect x="45" y="0.5" width="22" height="12" rx="3.5" fill="none" stroke="#fff" opacity=".45"/><rect x="47" y="2.5" width="16" height="8" rx="2"/><rect x="68" y="4.5" width="1.6" height="4" rx=".8" opacity=".45"/></g></svg></div>

  <div class="bal glass"><div class="l">Credits</div><div class="v tnum"><b>48.21</b><span>M</span></div><div class="r tnum">+312.4 K/s <em>· ×2</em></div></div>
  <div class="od glass"><div class="bolt"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M10 1L3 10h5l-1 7 7-9H9z" fill="#2a1200"/></svg></div><div><b>×2 on</b><span class="tnum">1:12:40 left</span></div></div>
  <div class="goalchip glass"><div class="row"><span>Fuel Tank</span><b class="tnum">62%</b></div><div class="sub">Rocket Mk I · section 2 of 4</div><div class="bar"><i></i></div></div>

  <div class="sheet">
    <div class="grab"></div>
    <div class="sh-head"><h2>Factories</h2><div class="pills"><span>×1</span><span class="on">×10</span><span>×100</span><span>Max</span></div></div>
    <div class="cards" id="cards"></div>
  </div>
  <div class="fade"></div>
  <div class="dockbar glass" id="dock"></div>
  <div class="home"></div>
</div>
<script src="../js/art.js"></script>
<script src="../js/art2.js"></script>
<script>
document.body.insertAdjacentHTML('afterbegin', SW.art.defs);
document.body.insertAdjacentHTML('afterbegin', SW.art2.defs);
document.getElementById('world').innerHTML = SW.art2.yard(390, 430, [1,1,1,1,1,1,0,0], 2, { station: true });
var F = [
  { n: 'Bolt Press', ic: 'bolt', c: 147, share: 3, ring: .7, msN: 8, cyc: 70, ms: '×2 in 3', hot: true, gain: '+1.2K/s', cost: '41.3K' },
  { n: 'Wire Mill', ic: 'wire', c: 86, share: 6, ring: .35, msN: 7, cyc: 35, ms: '×2 in 14', gain: '+4.9K/s', cost: '512K' },
  { n: 'Fuel Refinery', ic: 'fuel', c: 65, share: 21, ring: .82, msN: 3, cyc: 82, ms: '×2 in 35', gain: '+18.6K/s', cost: '1.14M', best: true },
  { n: 'Hull Foundry', ic: 'hull', c: 49, share: 38, ring: .55, msN: 9, cyc: 55, ms: '×2 in 1', hot: true, gain: '+41K/s', cost: '52.8M', off: true },
  { n: 'Engine Works', ic: 'engine', c: 12, share: 32, ring: .2, msN: 1, cyc: 20, ms: '×2 in 13', gain: '+66K/s', cost: '96.4M', off: true }
];
function ring(p, best) {
  var c = 2 * Math.PI * 26.5;
  return '<svg class="rg" width="60" height="60" viewBox="0 0 60 60"><circle cx="30" cy="30" r="26.5" fill="none" stroke="rgba(170,200,240,.14)" stroke-width="3.5"/>' +
    '<circle cx="30" cy="30" r="26.5" fill="none" stroke="' + (best ? '#ff8a3d' : '#8fc1f5') + '" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + (c * (1 - p)).toFixed(1) + '" transform="rotate(-90 30 30)"' + (best ? ' style="filter:drop-shadow(0 0 4px rgba(255,138,61,.7))"' : '') + '/></svg>';
}
function segs(n) { var h = ''; for (var i = 0; i < 10; i++) h += '<b class="' + (i < n ? 'f' : '') + (i === 9 ? ' n' : '') + '"></b>'; return h; }
document.getElementById('cards').innerHTML = F.map(function (f) {
  return '<div class="card' + (f.best ? ' best' : '') + (f.off ? ' off' : '') + '">' +
    '<div class="rt">' + ring(f.ring, f.best) + '<div class="tile">' + SW.art2.icon(f.ic, 26) + '</div><span class="cnt tnum">' + f.c + '</span></div>' +
    '<div class="mid"><div class="t">' + f.n + '</div>' +
    '<div class="s">' + (f.best ? '<span class="bv">Best value</span> · ' : '') + '<b>' + f.share + '%</b> of income</div>' +
    '<div class="pr"><div class="mseg">' + segs(f.msN) + '</div><span class="' + (f.hot ? 'hot' : '') + '">' + f.ms + '</span></div></div>' +
    '<div class="btn tnum"><small>' + f.gain + '</small><b>' + f.cost + '</b></div></div>';
}).join('');
var T = [['factory', 'Factories', 1], ['up', '', 0, 1], ['rocket'], ['station'], ['more', '', 0, 1]];
document.getElementById('dock').innerHTML = T.map(function (t) { return '<span class="' + (t[2] ? 'on' : '') + '"><svg><use href="#i-' + t[0] + '"/></svg>' + (t[2] ? t[1] : '') + (t[3] ? '<i class="dot"></i>' : '') + '</span>'; }).join('');
</script>
</body></html>
