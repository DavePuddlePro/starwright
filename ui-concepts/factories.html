<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starwright · Factories close-up</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Manrope:wght@600;700&display=swap">
<style>
* { box-sizing: border-box; margin: 0; }
body { background: #0a1222; color: #eef3fb; font: 13px/1.3 "Manrope", sans-serif; }
.wrap { width: 390px; height: 844px; margin: 0 auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
h1 { font: 600 19px/1 "Outfit", sans-serif; padding: 0 4px; }
h1 span { display: block; margin-top: 6px; font: 600 12px/1.3 "Manrope", sans-serif; color: #8494ae; }
.grid { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 172px; gap: 8px; }
.fc { border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; background: linear-gradient(180deg, #172f55 0%, #3a66a0 62%, #f0aa82 100%); border: 1px solid rgba(170,200,240,.14); }
.fc svg { display: block; width: 100%; flex: 1; min-height: 0; }
.fc .cap { padding: 7px 10px 8px; background: #0f1a2f; display: flex; flex-direction: column; gap: 4px; }
.fc .cap b { font: 700 12.5px/1 "Manrope", sans-serif; }
.fc .cap span { font: 600 10.5px/1 "Manrope", sans-serif; color: #ffb27d; }
.fac2.ghost * { fill: none !important; stroke: rgba(225,238,255,.6) !important; stroke-width: .8 !important; stroke-dasharray: 3 2.5; filter: none !important; }
</style></head>
<body>
<div class="wrap">
  <h1>The factories, up close<span>Every building is shaped like the thing it makes.</span></h1>
  <div class="grid" id="grid"></div>
</div>
<script src="../js/art.js"></script>
<script src="../js/art2.js"></script>
<script>
document.body.insertAdjacentHTML('afterbegin', SW.art.defs + SW.art2.defs);
// [id, name, what you see, left, width, height]
var F = [
  ['bolt', 'Bolt Press', 'A giant bolt: hex head, threaded body', -4, 76, 58],
  ['wire', 'Wire Mill', 'A spool wound with copper wire', -4, 54, 60],
  ['fuel', 'Fuel Refinery', 'A fuel-drop tank and flare stack', -10, 60, 98],
  ['hull', 'Hull Foundry', 'A rocket hull section, glowing inside', -2, 66, 84],
  ['engine', 'Engine Works', 'A rocket engine, door in the nozzle', -6, 60, 66],
  ['avionics', 'Avionics Lab', 'A microchip raised on a mast', -12, 52, 124],
  ['kiln', 'Heat Shield Kiln', 'A dome of black heat-shield tiles', -4, 44, 48]
];
document.getElementById('grid').innerHTML = F.map(function (x) {
  var gy = 110, h = x[5] + 8;
  return '<div class="fc"><svg viewBox="' + x[3] + ' ' + (gy - h) + ' ' + x[4] + ' ' + (h + 4) + '" preserveAspectRatio="xMidYMax meet">' +
    '<rect x="' + (x[3] - 20) + '" y="' + gy + '" width="' + (x[4] + 40) + '" height="10" fill="#0d1a30"/>' + SW.art2.factory(x[0], 0, gy, true) + '</svg>' +
    '<div class="cap"><b>' + x[1] + '</b><span>' + x[2] + '</span></div></div>';
}).join('') + '<div class="fc"><svg viewBox="-12 6 76 108" preserveAspectRatio="xMidYMax meet"><rect x="-30" y="110" width="120" height="10" fill="#0d1a30"/>' + SW.art2.factory('bolt', 0, 110, false) + '</svg><div class="cap"><b>Not built yet</b><span>Blueprint outline</span></div></div>';
</script>
</body></html>
