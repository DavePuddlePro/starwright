<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d1628">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Starwright">
<meta name="description" content="A calm idle game: restart an old launch yard and build a starship, one launch at a time.">
<title>Starwright</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script>
  // Home-screen app: size the game to the full physical screen height (iPhone reports less).
  (function () {
    var standalone = window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
    if (!standalone) return;
    var root = document.documentElement;
    root.classList.add('standalone');
    function fit() {
      var portrait = window.innerHeight >= window.innerWidth;
      var screenH = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
      root.style.setProperty('--app-h', Math.max(window.innerHeight, screenH) + 'px');
    }
    fit();
    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
  })();
</script>
<div id="app"></div>
<script src="js/config.js"></script>
<script src="js/format.js"></script>
<script src="js/economy.js"></script>
<script src="js/progress.js"></script>
<script src="js/moon.js"></script>
<script src="js/mars.js"></script>
<script src="js/kestrel.js"></script>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/art2.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
<script>
  // Offline support (only works when served over https or localhost).
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>
</body>
</html>
